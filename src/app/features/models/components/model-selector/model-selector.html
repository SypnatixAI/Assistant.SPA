<section class="model-selector" aria-label="Modèle de réponse">
  @if (error(); as errorMessage) {
    <div class="model-selector__error" role="alert">
      <span>{{ errorMessage }}</span>
      <button type="button" (click)="refreshRequested.emit()">Réessayer</button>
    </div>
  } @else {
    <label class="visually-hidden" for="model-selection">Modèle de réponse</label>
    <div class="model-selector__control" [attr.title]="selectedModel()?.description ?? null">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="m12 3 1.2 4.1a5 5 0 0 0 3.4 3.4l4.1 1.2-4.1 1.2a5 5 0 0 0-3.4 3.4L12 20.4l-1.2-4.1a5 5 0 0 0-3.4-3.4l-4.1-1.2 4.1-1.2a5 5 0 0 0 3.4-3.4L12 3Z"
        />
      </svg>
      <select
        id="model-selection"
        [disabled]="isLoading() || models().length === 0"
        [value]="selectedModelId() ?? ''"
        [attr.aria-describedby]="selectedModel() ? 'selected-model-description' : null"
        (change)="selectModel($event)"
      >
        @for (model of models(); track model.id) {
          <option [value]="model.id">{{ model.displayName }}</option>
        }
      </select>
    </div>
    @if (isLoading()) {
      <span class="model-selector__status" role="status">Chargement des modèles…</span>
    } @else if (selectedModel(); as model) {
      <span id="selected-model-description" class="visually-hidden">{{ model.description }}</span>
    }
  }
</section>
