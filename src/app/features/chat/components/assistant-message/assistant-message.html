<article class="message">
  <div class="message__avatar" aria-hidden="true">A<span></span></div>
  <div class="message__body">
    <h2 class="visually-hidden">Message d’onPremia</h2>
    <div class="message__content" [innerHTML]="renderedContent()"></div>

  </div>
</article>
