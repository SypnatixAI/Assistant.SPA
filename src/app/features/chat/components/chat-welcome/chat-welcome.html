<section class="welcome" aria-labelledby="welcome-title">
  <div class="welcome__header">
    <h1 id="welcome-title">Bonjour {{ firstName() }}, comment puis-je vous aider ?</h1>
    <p>
      Recherchez, résumez ou comparez les informations disponibles dans les documents de
      {{ organizationName() }}.
    </p>
  </div>

  <div class="suggestions" aria-label="Exemples de questions">
    @for (question of questions(); track question) {
      <button type="button" (click)="questionSelected.emit(question)">
        <span>{{ question }}</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
      </button>
    }
  </div>
  <p class="welcome__trust">
    Les réponses utilisent uniquement les contenus auxquels votre compte a accès.
  </p>
</section>
