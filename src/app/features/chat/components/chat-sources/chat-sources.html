@if (sources().length > 0) {
  <section class="sources" aria-labelledby="sources-title">
    <h3 id="sources-title">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 4.5h9.5L19 8v11.5H6z" />
        <path d="M15.5 4.5V8H19M9 12h7M9 15h5" />
      </svg>
      Sources consultées
    </h3>
    <ul>
      @for (source of sources(); track source.reference) {
        <li>
          @if (safeUrl(source.url); as url) {
            <a [href]="url" target="_blank" rel="noopener noreferrer">
              {{ source.title }} <span class="visually-hidden">(nouvel onglet)</span>
            </a>
          } @else {
            <span>{{ source.title }}</span>
          }
          <small>{{ source.type }}</small>
        </li>
      }
    </ul>
  </section>
}
