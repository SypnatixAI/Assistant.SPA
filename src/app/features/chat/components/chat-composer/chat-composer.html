<form class="composer" (ngSubmit)="submit()">
  <label class="visually-hidden" for="chat-message">Votre question</label>
  <textarea
    #messageInput
    id="chat-message"
    rows="1"
    placeholder="Posez votre question…"
    autocomplete="off"
    [formControl]="messageControl"
    [attr.aria-describedby]="
      messageControl.hasError('maxlength')
        ? 'message-error message-counter'
        : 'message-hint message-counter'
    "
    (keydown)="handleKeydown($event)"
  ></textarea>
  <button type="submit" [disabled]="messageControl.invalid || messageControl.disabled">
    <span class="send-label">Envoyer</span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6.5 10.5 12 5l5.5 5.5" /></svg>
  </button>
  <div class="composer__meta">
    @if (messageControl.hasError('maxlength')) {
      <span id="message-error" role="alert">
        La question dépasse {{ maximumLength }} caractères.
      </span>
    } @else {
      <span id="message-hint">Entrée pour envoyer · Maj+Entrée pour une nouvelle ligne</span>
    }
    <span id="message-counter" [class.is-invalid]="messageControl.hasError('maxlength')">
      {{ messageControl.value.length | number: '1.0-0' }} /
      {{ maximumLength | number: '1.0-0' }}
    </span>
  </div>
</form>
