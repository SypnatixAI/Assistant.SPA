<main class="page-shell">
  <section class="page-card" aria-labelledby="application-title">
    <h1 id="application-title">Espace AssistantCore</h1>
    @if (session(); as currentSession) {
      <p>
        Connecté comme {{ currentSession.user.displayName }} pour
        {{ currentSession.organization.name }}.
      </p>
    }
    <button class="logout-button" type="button" (click)="logout()">
      Se déconnecter
    </button>
  </section>
</main>
