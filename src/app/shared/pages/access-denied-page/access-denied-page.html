<main class="access-denied-page">
  <section class="access-denied-panel" aria-labelledby="access-denied-title">
    <p class="eyebrow">onPremia</p>
    <h1 id="access-denied-title">Votre compte n’a pas accès à cet espace.</h1>
    <p>
      Votre identité Microsoft est valide, mais votre organisation ou votre
      rôle ne permet pas d’ouvrir onPremia. Communiquez avec votre
      administrateur si cet accès devrait vous être accordé.
    </p>
    <div class="actions">
      <button type="button" (click)="logout()">Utiliser un autre compte</button>
      <a href="mailto:support@assistantcore.com">Contacter le soutien</a>
    </div>
  </section>
</main>
