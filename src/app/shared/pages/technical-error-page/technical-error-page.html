<main class="page-shell">
  <section class="page-card" aria-labelledby="technical-error-title">
    <p class="eyebrow">AssistantCore</p>
    <h1 id="technical-error-title">Une erreur technique est survenue</h1>
    <p>
      L’application ne peut pas continuer pour le moment. Rechargez la page ou
      réessayez plus tard.
    </p>
    <button type="button" (click)="reloadApplication()">
      Recharger l’application
    </button>
  </section>
</main>
