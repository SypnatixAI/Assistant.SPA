<main class="technical-error-page">
  <section class="error-panel" aria-labelledby="technical-error-title">
    <header class="brand">
      <span class="brand-mark" aria-hidden="true">O</span>
      <span>{{ content.brandName }}</span>
    </header>

    <div class="error-content">
      <div class="status-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <path [attr.d]="icons.warning" />
        </svg>
      </div>

      <p class="eyebrow">{{ content.eyebrow }}</p>
      <h1 id="technical-error-title">{{ content.title }}</h1>
      <p class="error-description">{{ content.description }}</p>

      <div class="actions">
        <button type="button" (click)="reloadApplication()">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path [attr.d]="icons.retry" />
          </svg>
          {{ content.retryLabel }}
        </button>
        <a [href]="content.supportHref">{{ content.supportLabel }}</a>
      </div>
    </div>

    <footer>
      <span class="status-dot" aria-hidden="true"></span>
      {{ content.footer }}
    </footer>
  </section>
</main>
