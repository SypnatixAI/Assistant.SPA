name: Deploy SPA DEV

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-spa-dev
  cancel-in-progress: false

env:
  AZURE_CORE_OUTPUT: none
  RESOURCE_GROUP: ${{ vars.AZURE_DEV_RESOURCE_GROUP }}
  ACR_NAME: ${{ vars.AZURE_ACR_NAME }}

jobs:
  deploy:
    name: Build once and deploy DEV
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to ACR
        run: az acr login --name "$ACR_NAME"

      - name: Build and push immutable SPA image
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          IMAGE_TAG="sha-${COMMIT_SHA}"
          LOGIN_SERVER="${ACR_NAME}.azurecr.io"
          docker build \
            --file deploy/docker/spa.Dockerfile \
            --tag "${LOGIN_SERVER}/assistant-spa:${IMAGE_TAG}" .
          docker push "${LOGIN_SERVER}/assistant-spa:${IMAGE_TAG}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "LOGIN_SERVER=${LOGIN_SERVER}" >> "$GITHUB_ENV"

      - name: Detect initial infrastructure bootstrap
        run: |
          if az containerapp show \
            --name ca-assistant-spa-dev \
            --resource-group "$RESOURCE_GROUP" \
            --only-show-errors >/dev/null 2>&1; then
            echo "APPLICATIONS_PROVISIONED=true" >> "$GITHUB_ENV"
          else
            echo "APPLICATIONS_PROVISIONED=false" >> "$GITHUB_ENV"
            {
              echo "### Image published; infrastructure not deployed yet"
              echo
              echo "Use SPA tag \`${IMAGE_TAG}\` with the backend Provision Azure infrastructure workflow."
              echo "After provisioning, rerun this workflow to deploy DEV."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy SPA revision
        if: ${{ env.APPLICATIONS_PROVISIONED == 'true' }}
        run: |
          az containerapp update \
            --name ca-assistant-spa-dev \
            --resource-group "$RESOURCE_GROUP" \
            --image "${LOGIN_SERVER}/assistant-spa:${IMAGE_TAG}"

      - name: Verify DEV SPA
        if: ${{ env.APPLICATIONS_PROVISIONED == 'true' }}
        run: |
          SPA_FQDN="$(az containerapp show \
            --name ca-assistant-spa-dev \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn --output tsv)"
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors \
            "https://${SPA_FQDN}/"
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors \
            "https://${SPA_FQDN}/assets/config/config.json"
