name: Promote SPA to CERTIF

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable DEV tag to promote, for example sha-0123...cdef
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-spa-certif
  cancel-in-progress: false

env:
  AZURE_CORE_OUTPUT: none
  DEV_RESOURCE_GROUP: ${{ vars.AZURE_DEV_RESOURCE_GROUP }}
  CERTIF_RESOURCE_GROUP: ${{ vars.AZURE_CERTIF_RESOURCE_GROUP }}
  ACR_NAME: ${{ vars.AZURE_ACR_NAME }}

jobs:
  promote:
    name: Promote existing SPA image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: certif

    steps:
      - name: Validate immutable tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if ! printf '%s' "$IMAGE_TAG" | grep -Eq '^sha-[0-9a-f]{40}$'; then
            echo "image_tag must be sha- followed by the complete 40-character Git SHA." >&2
            exit 1
          fi

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify image and DEV provenance
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          az acr repository show \
            --name "$ACR_NAME" \
            --image "assistant-spa:${IMAGE_TAG}" \
            --only-show-errors >/dev/null

          DEV_IMAGE="$(az containerapp show \
            --name ca-assistant-spa-dev \
            --resource-group "$DEV_RESOURCE_GROUP" \
            --query properties.template.containers[0].image --output tsv)"
          EXPECTED_IMAGE="${ACR_NAME}.azurecr.io/assistant-spa:${IMAGE_TAG}"
          if [ "$DEV_IMAGE" != "$EXPECTED_IMAGE" ]; then
            echo "The requested image is not the SPA revision currently validated in DEV." >&2
            exit 1
          fi

      - name: Deploy CERTIF SPA at zero replicas
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          az containerapp update \
            --name ca-assistant-spa-certif \
            --resource-group "$CERTIF_RESOURCE_GROUP" \
            --image "${ACR_NAME}.azurecr.io/assistant-spa:${IMAGE_TAG}" \
            --min-replicas 0

      - name: Verify CERTIF SPA
        run: |
          SPA_FQDN="$(az containerapp show \
            --name ca-assistant-spa-certif \
            --resource-group "$CERTIF_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn --output tsv)"
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors \
            "https://${SPA_FQDN}/"
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors \
            "https://${SPA_FQDN}/assets/config/config.json"

