name: Promote SPA to CERTIF

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional SPA SHA tag; defaults to the latest published tag in ACR
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-spa-certif
  cancel-in-progress: false

env:
  AZURE_CORE_OUTPUT: none
  CERTIF_RESOURCE_GROUP: ${{ vars.AZURE_CERTIF_RESOURCE_GROUP }}
  ACR_NAME: ${{ vars.AZURE_ACR_NAME }}

jobs:
  promote:
    name: Promote existing SPA image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: certif

    steps:
      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve immutable tag
        id: image
        env:
          REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          IMAGE_TAG="$REQUESTED_IMAGE_TAG"
          if [ -z "$IMAGE_TAG" ]; then
            IMAGE_TAG="$(az acr repository show-tags \
              --name "$ACR_NAME" \
              --repository assistant-spa \
              --orderby time_desc \
              --output tsv \
              | grep -m 1 -E '^sha-[0-9a-f]{40}$' || true)"
          fi

          if ! printf '%s' "$IMAGE_TAG" | grep -Eq '^sha-[0-9a-f]{40}$'; then
            echo "No published SPA SHA tag was found in ACR, or image_tag is not a complete Git SHA." >&2
            exit 1
          fi
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Verify image in ACR
        env:
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: |
          az acr repository show \
            --name "$ACR_NAME" \
            --image "assistant-spa:${IMAGE_TAG}" \
            --only-show-errors >/dev/null


      - name: Deploy CERTIF SPA for verification
        env:
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: |
          az containerapp update \
            --name ca-assistant-spa-certif \
            --resource-group "$CERTIF_RESOURCE_GROUP" \
            --image "${ACR_NAME}.azurecr.io/assistant-spa:${IMAGE_TAG}" \
            --min-replicas 1

      - name: Verify CERTIF SPA
        run: |
          SPA_FQDN="$(az containerapp show \
            --name ca-assistant-spa-certif \
            --resource-group "$CERTIF_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn --output tsv)"
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors \
            "https://${SPA_FQDN}/"
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors \
            "https://${SPA_FQDN}/assets/config/config.json"
